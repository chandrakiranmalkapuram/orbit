<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep Cosmic Obsidian Background -->
    <radialGradient id="bg-radial" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#11182c" />
      <stop offset="50%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <!-- Surya Saffron to Sunburst Gold -->
    <linearGradient id="saffron-stream" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3300" />
      <stop offset="30%" stop-color="#FF6B00" />
      <stop offset="65%" stop-color="#FF9900" />
      <stop offset="90%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>

    <!-- Ashoka Royal Navy & Sky Sapphire -->
    <linearGradient id="ashoka-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Radiant Surya Core -->
    <radialGradient id="surya-core" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="22%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </radialGradient>

    <!-- Ambient Saffron Glow -->
    <radialGradient id="kesari-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#FF9933" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Sapphire Glow -->
    <radialGradient id="sapphire-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#1D4ED8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <filter id="glow-saffron" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Base -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg-radial)" stroke="#1e293b" stroke-width="3.5" />

  <!-- Ambient Planetary Glows -->
  <circle cx="512" cy="512" r="390" fill="url(#kesari-glow)" />
  <circle cx="512" cy="512" r="270" fill="url(#sapphire-glow)" />

  <!-- Minimal 24-point Kala Chakra Track (Ashoka Spokes Motif) -->
  <g opacity="0.75">
    <circle cx="512" cy="512" r="242" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="3 9.7" opacity="0.6" />
    <line x1="738.00" y1="512.00" x2="756.00" y2="512.00" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="730.29" y1="570.61" x2="748.11" y2="575.25" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="707.72" y1="625.00" x2="724.99" y2="634.00" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="671.85" y1="671.85" x2="688.24" y2="688.24" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="625.00" y1="707.72" x2="634.00" y2="724.99" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="570.61" y1="730.29" x2="575.25" y2="748.11" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="512.00" y1="738.00" x2="512.00" y2="756.00" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="453.39" y1="730.29" x2="448.75" y2="748.11" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="399.00" y1="707.72" x2="390.00" y2="724.99" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="352.15" y1="671.85" x2="335.76" y2="688.24" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="316.28" y1="625.00" x2="299.01" y2="634.00" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="293.71" y1="570.61" x2="275.89" y2="575.25" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="286.00" y1="512.00" x2="268.00" y2="512.00" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="293.71" y1="453.39" x2="275.89" y2="448.75" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="316.28" y1="399.00" x2="299.01" y2="390.00" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="352.15" y1="352.15" x2="335.76" y2="335.76" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="399.00" y1="316.28" x2="390.00" y2="299.01" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="453.39" y1="293.71" x2="448.75" y2="275.89" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="512.00" y1="286.00" x2="512.00" y2="268.00" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="570.61" y1="293.71" x2="575.25" y2="275.89" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="625.00" y1="316.28" x2="634.00" y2="299.01" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="671.85" y1="352.15" x2="688.24" y2="335.76" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="707.72" y1="399.00" x2="724.99" y2="390.00" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
    <line x1="730.29" y1="453.39" x2="748.11" y2="448.75" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Counter Orbit: Sapphire Cosmic Track -->
  <g transform="rotate(32 512 512)" opacity="0.85">
    <ellipse cx="512" cy="512" rx="350" ry="115" fill="none" stroke="url(#ashoka-blue)" stroke-width="6" stroke-dasharray="15 10" />
    <!-- Emerald Orbiting Node (Tricolor Harmony) -->
    <circle cx="862" cy="512" r="13" fill="#10B981" filter="url(#glow-subtle)" />
    <circle cx="862" cy="512" r="7" fill="#D1FAE5" />
  </g>

  <!-- Primary Orbit: Radiant Saffron Ribbon -->
  <g transform="rotate(-26 512 512)" filter="url(#glow-saffron)">
    <ellipse cx="512" cy="512" rx="380" ry="145" fill="none" stroke="url(#saffron-stream)" stroke-width="15" stroke-linecap="round" opacity="0.95" />
    
    <!-- Golden Saffron Celestial Node -->
    <circle cx="892" cy="512" r="19" fill="#FFD000" />
    <circle cx="892" cy="512" r="10" fill="#FFFBEB" />

    <!-- Trailing Kesari Energy Particle -->
    <circle cx="132" cy="512" r="12" fill="#FF4500" opacity="0.85" />
  </g>

  <!-- Central Surya Core (Sun Body) -->
  <circle cx="512" cy="512" r="132" fill="url(#surya-core)" filter="url(#glow-saffron)" />
  
  <!-- Cosmic Depth Moat -->
  <circle cx="512" cy="512" r="94" fill="#070a14" />
  <circle cx="512" cy="512" r="94" fill="none" stroke="url(#gold-ring)" stroke-width="2" opacity="0.6" />

  <!-- Inner Surya Nucleus -->
  <circle cx="512" cy="512" r="52" fill="url(#surya-core)" filter="url(#glow-subtle)" />
  <circle cx="512" cy="512" r="20" fill="#FFFFFF" opacity="0.92" />
</svg>
