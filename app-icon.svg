<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="85%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App icon squircle background -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)" stroke="#27272a" stroke-width="4" />

  <!-- Outer ambient ring -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="#27272a" stroke-width="2" stroke-dasharray="6 12" opacity="0.6" />

  <!-- Elliptical Orbit Rings -->
  <g transform="rotate(-25 512 512)" filter="url(#glow)">
    <ellipse cx="512" cy="512" rx="360" ry="140" fill="none" stroke="url(#orbit-grad)" stroke-width="12" opacity="0.85" />
    <!-- Orbiting particle -->
    <circle cx="872" cy="512" r="16" fill="#38bdf8" />
    <circle cx="152" cy="512" r="12" fill="#c084fc" />
  </g>

  <!-- Inner Glowing Core -->
  <circle cx="512" cy="512" r="130" fill="url(#core-glow)" filter="url(#glow)" />
  <circle cx="512" cy="512" r="100" fill="#09090b" opacity="0.9" />
  <circle cx="512" cy="512" r="50" fill="url(#orbit-grad)" />
</svg>
